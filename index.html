<script type="text/babel" data-presets="react" data-type="module">
try {
const { useState, useEffect, useMemo } = React;

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAmwHWES55cGDc5SALl5TFtxYm8uDNwS7E",
  authDomain: "albalat-app.firebaseapp.com",
  projectId: "albalat-app",
  storageBucket: "albalat-app.firebasestorage.app",
  messagingSenderId: "334294137004",
  appId: "1:334294137004:web:c4caf4408ba13890f80709",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

/* ============ FECHAS ============ */
const DIAS_SEMANA = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function toISO(d){ return d.toISOString().slice(0,10); }
function addDays(base,n){ const d = new Date(base); d.setDate(d.getDate()+n); return d; }
function formatFecha(d){ return `${DIAS_SEMANA[(d.getDay()+6)%7]} ${d.getDate()} ${MESES[d.getMonth()]}`; }
function esFinde(d){ return d.getDay()===0 || d.getDay()===6; }
function minutosDesdeHHMM(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function hhmmDesdeMinutos(min){ const h=Math.floor(min/60).toString().padStart(2,"0"); const m=(min%60).toString().padStart(2,"0"); return `${h}:${m}`; }
function diasDelMes(year,month){ return new Date(year, month+1, 0).getDate(); }
function primerDiaSemana(year,month){ const dia = new Date(year,month,1).getDay(); return (dia+6)%7; }

/* ============ ROLES ============ */
const ROLES = ["direccion","decanato","casa","resto"];
const ROL_LABEL = { direccion:"Dirección", decanato:"Decanato", casa:"Casa", resto:"Resto" };

/* ============ HOOKS FIRESTORE ============ */
function useAuthUser(){
  const [user, setUser] = useState(undefined);
  useEffect(() => auth.onAuthStateChanged(setUser), []);
  const [perfil, setPerfil] = useState(undefined);
  useEffect(() => {
    if (!user) { setPerfil(user === null ? null : undefined); return; }
    return db.collection("usuarios").doc(user.uid).onSnapshot((snap) => {
      setPerfil(snap.exists ? { id: snap.id, ...snap.data() } : null);
    });
  }, [user]);
  return { user, perfil };
}
function useColeccion(path){
  const [data, setData] = useState([]);
  useEffect(() => db.collection(path).onSnapshot((snap) => {
    setData(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
  }), [path]);
  return data;
}
function useDoc(path, defaults){
  const [data, setData] = useState(defaults);
  useEffect(() => db.doc(path).onSnapshot((snap) => {
    setData(snap.exists ? { ...defaults, ...snap.data() } : defaults);
  }), [path]);
  return data;
}
// Sin Firebase Storage (evita requerir plan de pago): redimensiona la imagen
// en el propio navegador y la guarda como texto base64 directamente en Firestore.
// Por eso hay que mantenerla pequeña (máx. ~480px de ancho, calidad reducida).
function subirImagen(carpeta, file) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error("No se pudo leer el archivo"));
    lector.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo procesar la imagen"));
      img.onload = () => {
        const maxAncho = 480;
        const escala = Math.min(1, maxAncho / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.src = e.target.result;
    };
    lector.readAsDataURL(file);
  });
}

/* ============ UI ATOMS ============ */
function Btn({ children, ...props }) { return <button className="btn-primary" {...props}>{children}</button>; }
function BtnSec({ children, ...props }) { return <button className="btn-secondary" {...props}>{children}</button>; }
function BtnLink({ children, ...props }) { return <button className="btn-link" {...props}>{children}</button>; }
function BtnDanger({ children, ...props }) { return <button className="btn-link-danger" {...props}>{children}</button>; }
function Campo({ label, children }) {
  return <div style={{ marginBottom: 8 }}><div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 3 }}>{label}</div>{children}</div>;
}
function SwitchTabs({ opciones, activo, onChange }) {
  return (
    <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
      {opciones.map((o) => (
        <button key={o.value} onClick={() => onChange(o.value)}
          style={{
            flex: opciones.length <= 4 ? 1 : "none",
            fontFamily: "inherit", fontSize: 13, padding: "8px 10px", borderRadius: 8,
            border: "1px solid var(--line)", cursor: "pointer",
            background: activo === o.value ? "var(--accent)" : "#fff",
            color: activo === o.value ? "#fff" : "var(--ink)",
            borderColor: activo === o.value ? "var(--accent)" : "var(--line)",
          }}>
          {o.label}
        </button>
      ))}
    </div>
  );
}
function TopTabs({ opciones, activo, onChange }) {
  return (
    <nav style={{ display: "flex", gap: 8, marginBottom: 16, borderBottom: "1px solid var(--line)" }}>
      {opciones.map((o) => (
        <button key={o.value} onClick={() => onChange(o.value)}
          style={{
            fontFamily: "inherit", background: "none", border: "none", padding: "8px 4px", fontSize: 14, cursor: "pointer",
            color: activo === o.value ? "var(--ink)" : "var(--muted)",
            borderBottom: activo === o.value ? "2px solid var(--accent)" : "2px solid transparent",
            fontWeight: activo === o.value ? 700 : 400,
          }}>
          {o.label}
        </button>
      ))}
    </nav>
  );
}

/* ============ MÓDULO: COMIDAS ============ */
const TURNOS_DEFECTO = {
  entreSemana: {
    desayuno: [{ id: "d1", label: "6:30 – 7:15" }, { id: "d2", label: "7:15 – 9:15" }],
    comida: [{ id: "c1", label: "13:30" }, { id: "c2", label: "14:30" }, { id: "c3", label: "15:40" }],
    cena: [{ id: "n1", label: "21:00" }, { id: "n2", label: "21:50" }],
  },
  finde: {
    desayuno: [{ id: "fd1", label: "7:30 – 9:30" }, { id: "fd2", label: "9:45 – 10:30" }],
    comida: [{ id: "fc1", label: "14:30" }],
    cena: [{ id: "fn1", label: "21:00" }],
  },
};
function construirFestivosCurso() {
  function rango(ini, fin) {
    const r = []; let d = new Date(ini + "T00:00:00"); const f = new Date(fin + "T00:00:00");
    while (d <= f) { r.push(toISO(d)); d = addDays(d, 1); }
    return r;
  }
  return [
    "2026-10-09", "2026-10-12", "2026-12-08", "2027-03-19",
    ...rango("2026-12-22", "2027-01-06"), ...rango("2027-03-25", "2027-04-05"),
  ];
}
const CONFIG_COMIDAS_DEFECTO = {
  turnos: TURNOS_DEFECTO,
  festivos: construirFestivosCurso(),
  patronActivoGlobal: true,
  fechaRetiro: null,
  fechaTunel: null,
};
const INICIO_CURSO = "2026-09-09";
const FIN_CURSO = "2027-06-18";
function dentroDeCurso(f) { return f >= INICIO_CURSO && f <= FIN_CURSO; }
function esLectivo(d, festivos) { const f = toISO(d); return !esFinde(d) && dentroDeCurso(f) && !festivos.includes(f); }
function nombreDiaPatron(d) { return ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"][d.getDay()]; }
function plazoCerrado(d, ahora) { const l = addDays(d, -1); l.setHours(20, 45, 0, 0); return ahora >= l; }

function ModuloComidas({ perfil, usuarios }) {
  const config = useDoc("config/comidas", CONFIG_COMIDAS_DEFECTO);
  const reservasDocs = useColeccion("comidas_reservas");
  const patronesDocs = useColeccion("comidas_patrones");
  const [vista, setVista] = useState("reservar");
  const [ahora] = useState(new Date());
  const [fechaResumen, setFechaResumen] = useState(null);
  const esDireccion = perfil.rol === "direccion";
  const festivos = config.festivos || [];

  const dias = useMemo(() => {
    const hoy = new Date(ahora); hoy.setHours(0,0,0,0);
    return Array.from({ length: 14 }, (_, i) => addDays(hoy, i));
  }, []);

  function turnosDelDia(d) { return esFinde(d) ? config.turnos.finde : config.turnos.entreSemana; }
  function getReserva(fecha) {
    const doc = reservasDocs.find((r) => r.id === `${perfil.id}_${fecha}`);
    return doc || { desayuno: null, comida: null, cena: null, tupper: false, retiro: false, tunel: false };
  }
  async function setReserva(fecha, patch) {
    await db.collection("comidas_reservas").doc(`${perfil.id}_${fecha}`).set({ uid: perfil.id, fecha, ...getReserva(fecha), ...patch }, { merge: true });
  }
  const patronPropio = (patronesDocs.find((p) => p.id === perfil.id) || {}).dias || {};
  async function guardarPatronDia(diaSemana, patch) {
    await db.collection("comidas_patrones").doc(perfil.id).set({ dias: { ...patronPropio, [diaSemana]: { ...(patronPropio[diaSemana] || {}), ...patch } } }, { merge: true });
  }
  async function aplicarPatron(fecha, d) {
    const p = patronPropio[nombreDiaPatron(d)];
    if (p) await setReserva(fecha, p);
  }

  const fechaResumenActiva = fechaResumen || toISO(dias[1] || dias[0]);
  const diaResumen = new Date(fechaResumenActiva + "T00:00:00");
  const resumen = useMemo(() => {
    const turnosDia = turnosDelDia(diaResumen);
    const porTurno = {};
    Object.entries(turnosDia).forEach(([tipo, lista]) => lista.forEach((t) => { porTurno[`${tipo}:${t.id}`] = { tipo, label: t.label, total: 0, regimenes: {} }; }));
    let tupperTotal = 0, retiroTotal = 0, tunelTotal = 0;
    usuarios.forEach((u) => {
      const r = reservasDocs.find((x) => x.id === `${u.id}_${fechaResumenActiva}`);
      if (!r) return;
      ["desayuno","comida","cena"].forEach((tipo) => {
        const turnoId = r[tipo];
        if (turnoId && porTurno[`${tipo}:${turnoId}`]) {
          porTurno[`${tipo}:${turnoId}`].total += 1;
          if (u.regimen != null) porTurno[`${tipo}:${turnoId}`].regimenes[u.regimen] = (porTurno[`${tipo}:${turnoId}`].regimenes[u.regimen] || 0) + 1;
        }
      });
      if (r.tupper) tupperTotal++;
      if (r.retiro) retiroTotal++;
      if (r.tunel) tunelTotal++;
    });
    return { porTurno, tupperTotal, retiroTotal, tunelTotal };
  }, [reservasDocs, usuarios, fechaResumenActiva, config.turnos]);

  function generarCuerpoMail() {
    const lineas = [`Resumen de comensales — ${formatFecha(diaResumen)}`, ""];
    ["desayuno","comida","cena"].forEach((tipo) => {
      const items = Object.values(resumen.porTurno).filter((x) => x.tipo === tipo);
      if (!items.length) return;
      lineas.push(tipo[0].toUpperCase() + tipo.slice(1) + ":");
      items.forEach((it) => {
        lineas.push(`  ${it.label}: ${it.total} comensales`);
        Object.entries(it.regimenes).forEach(([num, count]) => lineas.push(`     · Régimen ${num}: ${count}`));
      });
      lineas.push("");
    });
    lineas.push(`Tupper: ${resumen.tupperTotal}`);
    if (resumen.retiroTotal > 0) lineas.push(`Retiro mensual: ${resumen.retiroTotal}`);
    if (resumen.tunelTotal > 0) lineas.push(`Túnel de estudio: ${resumen.tunelTotal}`);
    return lineas.join("\n");
  }
  function enviarResumen() {
    const url = `mailto:albalatservicios@gmail.com?subject=${encodeURIComponent("Comensales " + formatFecha(diaResumen))}&body=${encodeURIComponent(generarCuerpoMail())}`;
    window.open(url, "_blank");
  }

  return (
    <div>
      <TopTabs
        opciones={[{ value: "reservar", label: "Reservar" }, ...(esDireccion ? [{ value: "resumen", label: "Resumen" }, { value: "admin", label: "Config" }] : [])]}
        activo={vista} onChange={setVista}
      />
      {vista === "reservar" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {config.patronActivoGlobal && (
            <PatronSemanalBox turnos={config.turnos} patron={patronPropio} onChange={guardarPatronDia} />
          )}
          {dias.map((d) => {
            const fecha = toISO(d);
            const cerrado = plazoCerrado(d, ahora);
            const lectivo = esLectivo(d, festivos);
            const r = getReserva(fecha);
            const tienePatron = config.patronActivoGlobal && patronPropio[nombreDiaPatron(d)];
            const esRetiro = fecha === config.fechaRetiro;
            const esTunel = fecha === config.fechaTunel;
            const ocupado = r.retiro || r.tunel;
            return (
              <div key={fecha} className="card" style={{ opacity: cerrado ? 0.55 : 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <strong style={{ fontSize: 15 }}>{formatFecha(d)}</strong>
                  {cerrado && <span style={{ fontSize: 10, background: "#f1e3d8", color: "var(--accent)", padding: "2px 8px", borderRadius: 20 }}>Plazo cerrado</span>}
                  {tienePatron && !cerrado && <BtnLink onClick={() => aplicarPatron(fecha, d)}>Usar patrón</BtnLink>}
                </div>
                <MealRow label="Desayuno" turnos={turnosDelDia(d).desayuno} value={r.desayuno} disabled={cerrado} regimen={perfil.regimen} onChange={(v) => setReserva(fecha, { desayuno: v })} />
                <MealRow label="Comida" turnos={turnosDelDia(d).comida} value={r.comida} disabled={cerrado || r.tupper || ocupado} regimen={perfil.regimen} onChange={(v) => setReserva(fecha, { comida: v })} />
                <MealRow label="Cena" turnos={turnosDelDia(d).cena} value={r.cena} disabled={cerrado} regimen={perfil.regimen} onChange={(v) => setReserva(fecha, { cena: v })} />
                {lectivo && (
                  <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 8 }}>
                    <input type="checkbox" disabled={cerrado || ocupado} checked={!!r.tupper} onChange={(e) => setReserva(fecha, { tupper: e.target.checked, comida: e.target.checked ? null : r.comida })} />
                    Pedir tupper (sustituye la comida)
                  </label>
                )}
                {esRetiro && (
                  <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 8 }}>
                    <input type="checkbox" disabled={cerrado} checked={!!r.retiro} onChange={(e) => setReserva(fecha, { retiro: e.target.checked, comida: e.target.checked ? null : r.comida, tupper: false, tunel: false })} />
                    Como con el Retiro mensual
                  </label>
                )}
                {esTunel && (
                  <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginTop: 8 }}>
                    <input type="checkbox" disabled={cerrado} checked={!!r.tunel} onChange={(e) => setReserva(fecha, { tunel: e.target.checked, comida: e.target.checked ? null : r.comida, tupper: false, retiro: false })} />
                    Como con el Túnel de estudio
                  </label>
                )}
              </div>
            );
          })}
        </div>
      )}

      {vista === "resumen" && esDireccion && (
        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <h2 style={{ fontSize: 15, margin: 0 }}>Resumen — {formatFecha(diaResumen)}</h2>
            <input type="date" className="input" style={{ width: "auto" }} value={fechaResumenActiva} onChange={(e) => setFechaResumen(e.target.value)} />
          </div>
          <p className="hint">Por defecto, el día siguiente. Elige cualquier otra fecha si lo necesitas.</p>
          <pre style={{ whiteSpace: "pre-wrap", fontFamily: "monospace", fontSize: 12, background: "var(--cream)", padding: 10, borderRadius: 8, border: "1px solid var(--line)" }}>{generarCuerpoMail()}</pre>
          <Btn onClick={enviarResumen}>Enviar resumen por email</Btn>
        </div>
      )}

      {vista === "admin" && esDireccion && (
        <ComidasAdmin config={config} usuarios={usuarios} />
      )}
    </div>
  );
}

function MealRow({ label, turnos, value, disabled, onChange, regimen }) {
  return (
    <div style={{ marginBottom: 8 }}>
      <span style={{ fontSize: 12, color: "var(--muted)", display: "block", marginBottom: 4 }}>{label}</span>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {turnos.map((t) => (
          <button key={t.id} disabled={disabled} onClick={() => onChange(value === t.id ? null : t.id)}
            className="chip" style={{ opacity: disabled ? 0.4 : 1 }}>
            <span className={value === t.id ? "active" : ""} style={value === t.id ? { color: "#fff" } : {}}>{t.label}</span>
          </button>
        ))}
      </div>
      {regimen != null && value && <span style={{ fontSize: 11, color: "var(--accent)", display: "block", marginTop: 3 }}>Régimen nº {regimen} (incluido automáticamente)</span>}
    </div>
  );
}
function PatronSemanalBox({ turnos, patron, onChange }) {
  const [abierto, setAbierto] = useState(false);
  const dias = [["lunes","Lunes",turnos.entreSemana],["martes","Martes",turnos.entreSemana],["miercoles","Miércoles",turnos.entreSemana],
    ["jueves","Jueves",turnos.entreSemana],["viernes","Viernes",turnos.entreSemana],["sabado","Sábado",turnos.finde],["domingo","Domingo",turnos.finde]];
  return (
    <div className="card" style={{ borderStyle: "dashed" }}>
      <BtnLink onClick={() => setAbierto(!abierto)} style={{ fontWeight: 700 }}>{abierto ? "▾" : "▸"} Patrón semanal por defecto</BtnLink>

/* ============ MÓDULO: DEPORTES ============ */
const CONFIG_DEPORTES_DEFECTO = {
  horarios: { entreSemana: { inicio: "09:00", fin: "23:00" }, finde: { inicio: "10:00", fin: "23:00" } },
  capacidadGimnasio: 5,
  capacidadPista: 1,
  maxBloquesPista: 3,
  maxBloquesGimnasio: null,
  limitarUnaReservaPistaPorDia: true,
  maxReservasGimnasioPorDia: 1,
};
function generarBloques(horario) {
  const ini = minutosDesdeHHMM(horario.inicio), fin = minutosDesdeHHMM(horario.fin);
  const b = [];
  for (let t = ini; t < fin; t += 30) b.push({ id: `b${t}`, label: hhmmDesdeMinutos(t) });
  return b;
}
function rangoHorarioBloques(blockIds) {
  const min = blockIds.map((id) => Number(id.slice(1))).sort((a, b) => a - b);
  return `${hhmmDesdeMinutos(min[0])}–${hhmmDesdeMinutos(min[min.length - 1] + 30)}`;
}

function ModuloDeportes({ perfil, usuarios }) {
  const config = useDoc("config/deportes", CONFIG_DEPORTES_DEFECTO);
  const reservas = useColeccion("deportes_reservas");
  const bloqueos = useColeccion("deportes_bloqueos");
  const [vista, setVista] = useState("reservar");
  const [recurso, setRecurso] = useState("pista");
  const [seleccion, setSeleccion] = useState(null);
  const [duracion, setDuracion] = useState(1);
  const [fechaHistorico, setFechaHistorico] = useState(toISO(addDays(new Date(), -1)));
  const esDireccion = perfil.rol === "direccion";
  const nombrePorId = (uid) => usuarios.find((u) => u.id === uid)?.nombre || uid;

  const [ahora] = useState(new Date());
  const dias = useMemo(() => { const hoy = new Date(ahora); hoy.setHours(0,0,0,0); return [hoy, addDays(hoy, 1)]; }, []);
  const [fechaActiva, setFechaActiva] = useState(toISO(dias[0]));
  const diaActivo = dias.find((d) => toISO(d) === fechaActiva) || dias[0];
  const horarioDia = esFinde(diaActivo) ? config.horarios.finde : config.horarios.entreSemana;
  const bloques = useMemo(() => generarBloques(horarioDia), [horarioDia]);
  const capacidad = recurso === "pista" ? config.capacidadPista : config.capacidadGimnasio;
  const maxBloques = recurso === "pista" ? config.maxBloquesPista : config.maxBloquesGimnasio;

  function reservasEnBloque(rec, fecha, blockId) { return reservas.filter((r) => r.recurso === rec && r.fecha === fecha && r.blockIds.includes(blockId)); }
  function bloqueoDe(rec, fecha, blockId) { return bloqueos.find((b) => (b.recurso === rec || b.recurso === "ambos") && b.fecha === fecha && (b.blockIds === null || b.blockIds.includes(blockId))); }
  function reservasUsuarioDia(rec, fecha) { return reservas.filter((r) => r.recurso === rec && r.fecha === fecha && r.uid === perfil.id); }
  function limiteAlcanzado(fecha) {
    if (recurso === "pista") return config.limitarUnaReservaPistaPorDia && reservasUsuarioDia("pista", fecha).length >= 1;
    return reservasUsuarioDia("gimnasio", fecha).length >= config.maxReservasGimnasioPorDia;
  }
  function tramoDisponible(fecha, blockIdInicio, cantidad) {
    const idx = bloques.findIndex((b) => b.id === blockIdInicio);
    if (idx === -1 || idx + cantidad > bloques.length) return null;
    const tramo = bloques.slice(idx, idx + cantidad);
    const ok = tramo.every((b) => !bloqueoDe(recurso, fecha, b.id) && reservasEnBloque(recurso, fecha, b.id).length < capacidad);
    return ok ? tramo : null;
  }
  async function confirmarReserva() {
    if (!seleccion || limiteAlcanzado(seleccion.fecha)) return;
    const tramo = tramoDisponible(seleccion.fecha, seleccion.blockId, duracion);
    if (!tramo) return;
    await db.collection("deportes_reservas").add({ recurso, fecha: seleccion.fecha, uid: perfil.id, blockIds: tramo.map((b) => b.id) });
    setSeleccion(null); setDuracion(1);
  }
  async function cancelarReserva(id) { await db.collection("deportes_reservas").doc(id).delete(); }

  return (
    <div>
      <TopTabs
        opciones={[{ value: "reservar", label: "Reservar" }, ...(esDireccion ? [{ value: "historico", label: "Histórico" }, { value: "admin", label: "Config" }] : [])]}
        activo={vista} onChange={setVista}
      />
      {vista === "reservar" && (
        <>
          <SwitchTabs opciones={[{ value: "pista", label: "Pista deportiva" }, { value: "gimnasio", label: "Gimnasio" }]} activo={recurso} onChange={(v) => { setRecurso(v); setSeleccion(null); }} />
          <SwitchTabs opciones={dias.map((d) => ({ value: toISO(d), label: formatFecha(d) }))} activo={fechaActiva} onChange={(v) => { setFechaActiva(v); setSeleccion(null); }} />
          {limiteAlcanzado(fechaActiva) && (
            <p className="hint" style={{ color: "var(--danger)", background: "#fbeae6", padding: "8px 10px", borderRadius: 8 }}>
              {recurso === "pista" ? "Ya tienes una reserva de pista este día." : `Ya tienes ${config.maxReservasGimnasioPorDia} reservas de gimnasio este día.`}
            </p>
          )}
          <div className="card" style={{ padding: 0, overflow: "hidden" }}>
            {bloques.map((b) => {
              const ocupantes = reservasEnBloque(recurso, fechaActiva, b.id);
              const bloqueo = bloqueoDe(recurso, fechaActiva, b.id);
              const libre = !bloqueo && ocupantes.length < capacidad;
              const miReserva = ocupantes.find((r) => r.uid === perfil.id);
              const nombres = ocupantes.map((r) => nombrePorId(r.uid)).join(", ");
              return (
                <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderBottom: "1px solid var(--line-soft)" }}>
                  <span style={{ width: 56, fontSize: 13, fontWeight: 700 }}>{b.label}</span>
                  <span style={{ flex: 1, fontSize: 12, color: "var(--muted)" }}>
                    {bloqueo ? `Bloqueado · ${bloqueo.motivo}` : recurso === "gimnasio" ? `${ocupantes.length}/${capacidad}${nombres ? " · " + nombres : ""}` : (libre ? "Libre" : `Ocupado · ${nombres}`)}
                  </span>
                  {miReserva ? (
                    <BtnDanger onClick={() => cancelarReserva(miReserva.id)}>Cancelar</BtnDanger>
                  ) : (
                    <BtnLink disabled={!libre || limiteAlcanzado(fechaActiva)} onClick={() => { setSeleccion({ fecha: fechaActiva, blockId: b.id }); setDuracion(1); }}>Reservar</BtnLink>
                  )}
                </div>
              );
            })}
          </div>
          {seleccion && (
            <div className="card" style={{ borderStyle: "dashed", marginTop: 10 }}>
              <div style={{ fontSize: 13, marginBottom: 8 }}>Inicio: <strong>{bloques.find((b) => b.id === seleccion.blockId)?.label}</strong></div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: "var(--muted)" }}>Duración:</span>
                {Array.from({ length: maxBloques || 4 }, (_, i) => i + 1).map((n) => (
                  <button key={n} onClick={() => setDuracion(n)} className="chip"><span className={duracion === n ? "active" : ""}>{n * 30} min</span></button>
                ))}
              </div>
              {!tramoDisponible(seleccion.fecha, seleccion.blockId, duracion) && <p className="hint" style={{ color: "var(--danger)" }}>Ese tramo no está disponible completo.</p>}
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <Btn disabled={!tramoDisponible(seleccion.fecha, seleccion.blockId, duracion)} onClick={confirmarReserva}>Confirmar</Btn>
                <BtnSec onClick={() => setSeleccion(null)}>Cancelar</BtnSec>
              </div>
            </div>
          )}
        </>
      )}

      {vista === "historico" && esDireccion && (
        <div className="card">
          <h2 style={{ fontSize: 15, marginTop: 0 }}>Histórico</h2>
          <input type="date" className="input" style={{ width: "auto" }} value={fechaHistorico} onChange={(e) => setFechaHistorico(e.target.value)} />
          {["pista", "gimnasio"].map((rec) => (
            <div key={rec} style={{ marginTop: 14 }}>
              <div style={{ fontSize: 12, textTransform: "uppercase", color: "var(--muted)", marginBottom: 4 }}>{rec}</div>
              {reservas.filter((r) => r.recurso === rec && r.fecha === fechaHistorico).length === 0 && <p className="hint">Sin reservas ese día.</p>}
              {reservas.filter((r) => r.recurso === rec && r.fecha === fechaHistorico).map((r) => (
                <div key={r.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
                  <span>{rangoHorarioBloques(r.blockIds)}</span><span>{nombrePorId(r.uid)}</span>
                </div>
              ))}
              {bloqueos.filter((b) => (b.recurso === rec || b.recurso === "ambos") && b.fecha === fechaHistorico).map((b) => (
                <div key={b.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0", color: "var(--danger)" }}>
                  <span>{b.blockIds ? rangoHorarioBloques(b.blockIds) : "Todo el día"}</span><span>Bloqueado · {b.motivo}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {vista === "admin" && esDireccion && <DeportesAdmin config={config} bloqueos={bloqueos} />}
    </div>
  );
}
function DeportesAdmin({ config, bloqueos }) {
  const [nb, setNb] = useState({ fecha: "", recurso: "ambos", todoDia: true, inicio: "09:00", fin: "10:00", motivo: "" });
  async function guardar(patch) { await db.doc("config/deportes").set(patch, { merge: true }); }
  async function guardarHorario(grupo, campo, valor) { await guardar({ horarios: { ...config.horarios, [grupo]: { ...config.horarios[grupo], [campo]: valor } } }); }
  async function crearBloqueo() {
    if (!nb.fecha || !nb.motivo) return;
    let blockIds = null;
    if (!nb.todoDia) {
      const ini = minutosDesdeHHMM(nb.inicio), fin = minutosDesdeHHMM(nb.fin);
      blockIds = []; for (let t = ini; t < fin; t += 30) blockIds.push(`b${t}`);
    }
    await db.collection("deportes_bloqueos").add({ fecha: nb.fecha, recurso: nb.recurso, blockIds, motivo: nb.motivo });
    setNb({ ...nb, motivo: "" });
  }
  async function quitarBloqueo(id) { await db.collection("deportes_bloqueos").doc(id).delete(); }

  return (
    <div className="card">
      <h2 style={{ fontSize: 15, marginTop: 0 }}>Bloquear franja o día</h2>
      <p className="hint">El motivo será visible para todos.</p>
      <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
        <input type="date" className="input" style={{ width: "auto" }} value={nb.fecha} onChange={(e) => setNb({ ...nb, fecha: e.target.value })} />
        <select className="input" style={{ width: "auto" }} value={nb.recurso} onChange={(e) => setNb({ ...nb, recurso: e.target.value })}>
          <option value="ambos">Pista y gimnasio</option><option value="pista">Solo pista</option><option value="gimnasio">Solo gimnasio</option>
        </select>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 6 }}>
        <input type="checkbox" checked={nb.todoDia} onChange={(e) => setNb({ ...nb, todoDia: e.target.checked })} /> Todo el día
      </label>
      {!nb.todoDia && (
        <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
          <input type="time" className="input" style={{ width: "auto" }} value={nb.inicio} onChange={(e) => setNb({ ...nb, inicio: e.target.value })} />
          <input type="time" className="input" style={{ width: "auto" }} value={nb.fin} onChange={(e) => setNb({ ...nb, fin: e.target.value })} />
        </div>
      )}
      <input className="input" placeholder="Motivo (visible para todos)" value={nb.motivo} onChange={(e) => setNb({ ...nb, motivo: e.target.value })} style={{ marginBottom: 6 }} />
      <Btn onClick={crearBloqueo}>Bloquear</Btn>
      {bloqueos.map((b) => (
        <div key={b.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0" }}>
          <span>{b.fecha} · {b.recurso} · {b.blockIds ? `${b.blockIds.length * 30} min` : "todo el día"} · {b.motivo}</span>
          <BtnDanger onClick={() => quitarBloqueo(b.id)}>Quitar</BtnDanger>
        </div>
      ))}

      <h2 style={{ fontSize: 15 }}>Horarios</h2>
      {[["entreSemana","Entre semana"],["finde","Fin de semana"]].map(([key, label]) => (
        <div key={key} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <span style={{ width: 110, fontSize: 13 }}>{label}</span>
          <input type="time" className="input" style={{ width: "auto" }} value={config.horarios[key].inicio} onChange={(e) => guardarHorario(key, "inicio", e.target.value)} />
          <input type="time" className="input" style={{ width: "auto" }} value={config.horarios[key].fin} onChange={(e) => guardarHorario(key, "fin", e.target.value)} />
        </div>
      ))}

      <h2 style={{ fontSize: 15 }}>Pista</h2>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <span style={{ width: 190, fontSize: 13 }}>Duración máxima</span>
        <select className="input" style={{ width: "auto" }} value={config.maxBloquesPista} onChange={(e) => guardar({ maxBloquesPista: Number(e.target.value) })}>
          {[1,2,3,4].map((n) => <option key={n} value={n}>{n * 30} min</option>)}
        </select>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 8 }}>
        <input type="checkbox" checked={config.limitarUnaReservaPistaPorDia} onChange={(e) => guardar({ limitarUnaReservaPistaPorDia: e.target.checked })} /> Limitar a una reserva al día
      </label>

      <h2 style={{ fontSize: 15 }}>Gimnasio</h2>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <span style={{ width: 190, fontSize: 13 }}>Aforo máximo</span>
        <input type="number" className="input" style={{ width: 80 }} value={config.capacidadGimnasio} onChange={(e) => guardar({ capacidadGimnasio: Number(e.target.value) })} />
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <span style={{ width: 190, fontSize: 13 }}>Reservas máx. por persona/día</span>
        <input type="number" className="input" style={{ width: 80 }} value={config.maxReservasGimnasioPorDia} onChange={(e) => guardar({ maxReservasGimnasioPorDia: Number(e.target.value) })} />
      </div>
    </div>
  );
}

function PantallaCentrada({ children }) {
  return <div style={{ minHeight: "80vh", display: "flex", flexDirection: "column", justifyContent: "center", gap: 10 }}>{children}</div>;
}
function LoginScreen({ onIrRegistro }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  async function entrar() {
    setError(""); setCargando(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      setError("Email o contraseña incorrectos.");
    }
    setCargando(false);

  return (
    <PantallaCentrada>

      <input className="input" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} />
      <input className="input" placeholder="Contraseña" type="password" value={password} onChange={(e) => setPassword(e.target.value)} />
      {error && <p className="hint" style={{ color: "var(--danger)", textAlign: "center" }}>{error}</p>}
      <Btn onClick={entrar} disabled={cargando}>{cargando ? "Entrando…" : "Entrar"}</Btn>
      <BtnLink onClick={onIrRegistro} style={{ textAlign: "center" }}>¿No tienes cuenta? Regístrate</BtnLink>
    </PantallaCentrada>

}
function RegistroScreen({ onVolver }) {
  const [nombre, setNombre] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [enviado, setEnviado] = useState(false);
  const [cargando, setCargando] = useState(false);

  async function registrar() {
    if (!nombre || !email || !password) { setError("Rellena todos los campos."); return; }
    setError(""); setCargando(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection("usuarios").doc(cred.user.uid).set({ nombre, email, rol: null, estado: "pendiente" });
      await auth.signOut();
      setEnviado(true);
    } catch (err) {
      setError(err.code === "auth/email-already-in-use" ? "Ya existe una cuenta con ese email." : "No se pudo crear la cuenta.");
    }
    setCargando(false);
  }

  if (enviado) {
    return (
      <PantallaCentrada>
        <div className="eyebrow" style={{ textAlign: "center" }}>Colegio Mayor Albalat</div>
        <h1 className="title" style={{ textAlign: "center" }}>Solicitud enviada</h1>
        <p className="hint" style={{ textAlign: "center" }}>Dirección revisará tu solicitud y te asignará un rol. Te avisarán cuando puedas entrar.</p>
        <Btn onClick={onVolver}>Volver a iniciar sesión</Btn>
      </PantallaCentrada>
    );
  }
  return (
    <PantallaCentrada>
      <div className="eyebrow" style={{ textAlign: "center" }}>Colegio Mayor Albalat</div>
      <h1 className="title" style={{ textAlign: "center", marginBottom: 14 }}>Crear cuenta</h1>
      <input className="input" placeholder="Nombre" value={nombre} onChange={(e) => setNombre(e.target.value)} />
      <input className="input" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} />
      <input className="input" placeholder="Contraseña" type="password" value={password} onChange={(e) => setPassword(e.target.value)} />
      {error && <p className="hint" style={{ color: "var(--danger)", textAlign: "center" }}>{error}</p>}
      <Btn onClick={registrar} disabled={cargando}>{cargando ? "Enviando…" : "Solicitar cuenta"}</Btn>
      <BtnLink onClick={onVolver} style={{ textAlign: "center" }}>Volver a iniciar sesión</BtnLink>
      <p className="hint" style={{ textAlign: "center" }}>Tu cuenta quedará pendiente hasta que dirección la apruebe y te asigne un rol.</p>
    </PantallaCentrada>
  );
}

/* ============ MÓDULO: CALENDARIO ============ */
const FILAS_CAL = [
  { key: "RES", color: "#a5652f", visibleParaTodos: true },
  { key: "SM", color: "#3c6e91", visibleParaTodos: false },
  { key: "SR", color: "#5c7c6b", visibleParaTodos: true },
  { key: "SG", color: "#6a5a8c", visibleParaTodos: false },
];
const ORDEN_PRIORIDAD_CAL = ["RES", "SM", "SR", "SG"];
function colorPorPrioridad(keys) { for (const k of ORDEN_PRIORIDAD_CAL) if (keys.includes(k)) return FILAS_CAL.find((f) => f.key === k).color; return "#8a7a63"; }
const MESES_CURSO_CAL = [
  { year: 2026, month: 8 }, { year: 2026, month: 9 }, { year: 2026, month: 10 }, { year: 2026, month: 11 },
  { year: 2027, month: 0 }, { year: 2027, month: 1 }, { year: 2027, month: 2 }, { year: 2027, month: 3 },
  { year: 2027, month: 4 }, { year: 2027, month: 5 },
];
function toISOymd(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }

function ModuloCalendario({ perfil }) {
  const celdasDocs = useColeccion("calendario_celdas");
  const eventos = useColeccion("calendario_eventos");
  const [mesIndex, setMesIndex] = useState(0);
  const [diaSel, setDiaSel] = useState(null);
  const esDireccion = perfil.rol === "direccion";
  const filasVisibles = FILAS_CAL.filter((f) => f.visibleParaTodos || perfil.rol !== "resto");
  const keysVisibles = filasVisibles.map((f) => f.key);

  const { year, month } = MESES_CURSO_CAL[mesIndex];
  const totalDias = diasDelMes(year, month);
  const offset = primerDiaSemana(year, month);
  const celdasGrid = [...Array.from({ length: offset }, () => null), ...Array.from({ length: totalDias }, (_, i) => i + 1)];

  function getCelda(fecha) { return (celdasDocs.find((c) => c.id === fecha)) || { RES: "", SM: "", SR: "", SG: "" }; }
  async function actualizarCelda(fecha, patch) { await db.collection("calendario_celdas").doc(fecha).set({ ...getCelda(fecha), ...patch }, { merge: true }); }
  function eventosDelDia(fecha) { return eventos.filter((e) => e.fecha === fecha).filter((e) => (e.apartados || []).some((a) => keysVisibles.includes(a))); }
  async function anadirEvento(fecha, promotor, actividad, apartados) {
    if (!actividad || apartados.length === 0) return;
    await db.collection("calendario_eventos").add({ fecha, promotor, actividad, apartados });
  }
  async function quitarEvento(id) { await db.collection("calendario_eventos").doc(id).delete(); }

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 4 }}>
        {filasVisibles.map((f) => (
          <span key={f.key} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: "var(--muted)" }}>
            <span style={{ width: 8, height: 8, borderRadius: "50%", background: f.color, display: "inline-block" }} /> {f.key}
          </span>
        ))}
      </div>
      <p className="hint" style={{ marginTop: 0, marginBottom: 10 }}>Si un día coincide en varios apartados se pinta con el de mayor prioridad: RES › SM › SR › SG.</p>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 16, marginBottom: 10 }}>
        <button className="btn-link" style={{ fontSize: 18, textDecoration: "none" }} disabled={mesIndex === 0} onClick={() => { setMesIndex((m) => m - 1); setDiaSel(null); }}>‹</button>
        <span style={{ fontSize: 15, fontWeight: 700, textTransform: "capitalize", width: 150, textAlign: "center" }}>{MESES_LARGO[month]} {year}</span>
        <button className="btn-link" style={{ fontSize: 18, textDecoration: "none" }} disabled={mesIndex === MESES_CURSO_CAL.length - 1} onClick={() => { setMesIndex((m) => m + 1); setDiaSel(null); }}>›</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", marginBottom: 4 }}>
        {DIAS_SEMANA.map((d) => <span key={d} style={{ textAlign: "center", fontSize: 11, color: "var(--muted)", fontWeight: 700 }}>{d[0]}</span>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
        {celdasGrid.map((dia, i) => {
          if (!dia) return <div key={i} style={{ minHeight: 54 }} />;
          const fecha = toISOymd(year, month, dia);
          const celda = getCelda(fecha);
          const evs = eventosDelDia(fecha);
          const filasConContenido = keysVisibles.filter((k) => celda[k]);
          const colorCelda = filasConContenido.length ? colorPorPrioridad(filasConContenido) : null;
          const textoCelda = filasConContenido.map((k) => celda[k]).join(" · ");
          const seleccionado = diaSel === fecha;
          return (
            <button key={i} onClick={() => setDiaSel(seleccionado ? null : fecha)}
              style={{ fontFamily: "inherit", minHeight: 54, background: "#fff", border: seleccionado ? "2px solid var(--accent)" : "1px solid var(--line)", borderRadius: 6, padding: 3, cursor: "pointer", textAlign: "left", display: "flex", flexDirection: "column", gap: 2 }}>
              <span style={{ fontSize: 11, fontWeight: 700 }}>{dia}</span>
              <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
                {colorCelda && <span style={{ fontSize: 8, color: "#fff", borderRadius: 3, padding: "1px 3px", background: colorCelda, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{textoCelda}</span>}
                {evs.map((e) => (
                  <span key={e.id} style={{ fontSize: 8, color: "#fff", borderRadius: 3, padding: "1px 3px", background: colorPorPrioridad((e.apartados || []).filter((a) => keysVisibles.includes(a))), overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.actividad}</span>
                ))}
              </div>
            </button>
          );
        })}
      </div>
      {diaSel && (
        <DiaPanelCalendario fecha={diaSel} celda={getCelda(diaSel)} eventos={eventosDelDia(diaSel)} filasVisibles={filasVisibles}
          esDireccion={esDireccion} onActualizarCelda={(p) => actualizarCelda(diaSel, p)}
          onAnadirEvento={(pr, ac, ap) => anadirEvento(diaSel, pr, ac, ap)} onQuitarEvento={quitarEvento} />
      )}
    </div>
  );
}
function DiaPanelCalendario({ fecha, celda, eventos, filasVisibles, esDireccion, onActualizarCelda, onAnadirEvento, onQuitarEvento }) {
  const [promotor, setPromotor] = useState("DIRECCIÓN");
  const [actividad, setActividad] = useState("");
  const [apartadosNuevo, setApartadosNuevo] = useState(["RES"]);
  function toggleApartado(key) { setApartadosNuevo((prev) => prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]); }
  return (
    <div className="card" style={{ marginTop: 14 }}>
      <h2 style={{ fontSize: 15, marginTop: 0 }}>{fecha}</h2>
      {filasVisibles.map((f) => (
        <div key={f.key} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: f.color, display: "inline-block" }} />
          <span style={{ width: 34, fontSize: 12, fontWeight: 700 }}>{f.key}</span>
          {esDireccion ? <input className="input" value={celda[f.key] || ""} onChange={(e) => onActualizarCelda({ [f.key]: e.target.value })} placeholder="—" /> : <span style={{ fontSize: 13 }}>{celda[f.key] || "—"}</span>}
        </div>
      ))}
      <h2 style={{ fontSize: 15 }}>Actividades del día</h2>
      {eventos.length === 0 && <p className="hint">Sin actividades registradas.</p>}
      {eventos.map((e) => (
        <div key={e.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, padding: "4px 0", borderBottom: "1px solid var(--line-soft)" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {e.posterUrl && <img src={e.posterUrl} alt="" style={{ width: 26, height: 26, objectFit: "cover", borderRadius: 4, border: "1px solid var(--line)" }} />}
            <strong>{e.promotor}</strong> — {e.actividad} <span style={{ color: "var(--muted)" }}>({(e.apartados || []).join(", ")})</span>
          </span>
          {esDireccion && <BtnDanger onClick={() => onQuitarEvento(e.id)}>Quitar</BtnDanger>}
        </div>
      ))}
      {esDireccion && (
        <div style={{ marginTop: 10 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
            <select className="input" style={{ width: "auto" }} value={promotor} onChange={(e) => setPromotor(e.target.value)}>
              {["DIRECCIÓN","DECANATO","CAPELLANÍA","UEX"].map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
            <input className="input" style={{ flex: 1 }} placeholder="Actividad" value={actividad} onChange={(e) => setActividad(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
            {FILAS_CAL.map((f) => (
              <label key={f.key} className="chip" style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <input type="checkbox" checked={apartadosNuevo.includes(f.key)} onChange={() => toggleApartado(f.key)} /> {f.key}
              </label>
            ))}
          </div>
          <BtnLink onClick={() => { onAnadirEvento(promotor, actividad, apartadosNuevo); setActividad(""); }}>+ Añadir</BtnLink>
        </div>
      )}
    </div>
  );
}

/* ============ MÓDULO: COMISIONES Y CLUBES ============ */
const COMISIONES_FIJAS = ["Tertulias","Fiestas","Deporte","Voluntariado","Cultura","Comunicación y RRSS","Estudio"];
const CLUBES_FIJOS = ["Club de la Chapa","Club de política","Club de cine","Club del Capotazo","Club de running","Coro","Kedada de lectura","Club del flaco","Club de humanidades","Club de la pecera","Club de pádel","Greatbooks"];

function ModuloComisiones({ perfil, usuarios }) {
  const items = useColeccion("comisiones_clubes");
  const [categoria, setCategoria] = useState("comisiones");
  const [itemAbiertoId, setItemAbiertoId] = useState(null);
  const [creando, setCreando] = useState(false);
  const puedeEditar = perfil.rol === "direccion" || perfil.rol === "decanato";
  const nombrePorId = (uid) => usuarios.find((u) => u.id === uid)?.nombre || (uid ? uid : "Sin asignar");
  const itemsCategoria = items.filter((i) => i.categoria === categoria);

  async function actualizarItem(id, patch) { await db.collection("comisiones_clubes").doc(id).set(patch, { merge: true }); }
  async function crearItem(nuevo) { await db.collection("comisiones_clubes").add({ ...nuevo, categoria }); setCreando(false); }
  async function borrarItem(id) { await db.collection("comisiones_clubes").doc(id).delete(); setItemAbiertoId(null); }
  async function toggleMiembro(item, uid) {
    const miembros = item.miembros.includes(uid) ? item.miembros.filter((m) => m !== uid) : [...item.miembros, uid];
    await actualizarItem(item.id, { miembros });
  }
  async function crearEventoCalendario(item, fecha, titulo, posterUrl) {
    if (!fecha || !titulo) return;
    await db.collection("calendario_eventos").add({ fecha, promotor: item.nombre, actividad: titulo, apartados: ["RES"], posterUrl: posterUrl || null, origenItemId: item.id });
  }

  async function sembrarIniciales() {
    const batch = db.batch();
    COMISIONES_FIJAS.forEach((nombre) => batch.set(db.collection("comisiones_clubes").doc(), { categoria: "comisiones", nombre, responsable: "", descripcion: "", horario: "", lugar: "", miembros: [] }));
    CLUBES_FIJOS.forEach((nombre) => batch.set(db.collection("comisiones_clubes").doc(), { categoria: "clubes", nombre, responsable: "", descripcion: "", horario: "", lugar: "", miembros: [] }));
    await batch.commit();
  }

  return (
    <div>
      <SwitchTabs opciones={[{ value: "comisiones", label: "Comisiones" }, { value: "clubes", label: "Clubes" }]} activo={categoria} onChange={(v) => { setCategoria(v); setItemAbiertoId(null); setCreando(false); }} />
      {puedeEditar && items.length === 0 && (
        <div className="card" style={{ borderStyle: "dashed", marginBottom: 12 }}>
          <p className="hint" style={{ marginTop: 0 }}>Todavía no se han cargado las comisiones y clubes iniciales.</p>
          <Btn onClick={sembrarIniciales}>Cargar comisiones y clubes iniciales</Btn>
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {itemsCategoria.length === 0 && <p className="hint">Todavía no hay {categoria}.</p>}
        {itemsCategoria.map((item) => {
          const abierto = itemAbiertoId === item.id;
          return (
            <div key={item.id} className="card" style={{ padding: 0, overflow: "hidden" }}>
              <button onClick={() => setItemAbiertoId(abierto ? null : item.id)} style={{ width: "100%", fontFamily: "inherit", background: "none", border: "none", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", textAlign: "left" }}>
                <span style={{ fontSize: 15, fontWeight: 700 }}>{item.nombre}</span>
                <span style={{ fontSize: 12, color: "var(--muted)" }}>{nombrePorId(item.responsable)}</span>
              </button>
              {abierto && (
                <ComisionDetalle item={item} usuarios={usuarios} puedeEditar={puedeEditar}
                  puedeCrearEvento={puedeEditar || item.responsable === perfil.id}
                  nombrePorId={nombrePorId}
                  onActualizar={(patch) => actualizarItem(item.id, patch)}
                  onToggleMiembro={(uid) => toggleMiembro(item, uid)}
                  onBorrar={() => borrarItem(item.id)}
                  onCrearEvento={(fecha, titulo, poster) => crearEventoCalendario(item, fecha, titulo, poster)}
                />
              )}
            </div>
          );
        })}
      </div>
      {puedeEditar && !creando && <Btn style={{ width: "100%", marginTop: 10 }} onClick={() => setCreando(true)}>+ Nueva {categoria === "comisiones" ? "comisión" : "club"}</Btn>}
      {puedeEditar && creando && <NuevoItemForm categoria={categoria} onCrear={crearItem} onCancelar={() => setCreando(false)} />}
    </div>
  );
}
function ComisionDetalle({ item, usuarios, puedeEditar, puedeCrearEvento, nombrePorId, onActualizar, onToggleMiembro, onBorrar, onCrearEvento }) {
  const [fechaEv, setFechaEv] = useState("");
  const [tituloEv, setTituloEv] = useState("");
  const [poster, setPoster] = useState(null);
  const [subiendo, setSubiendo] = useState(false);
  async function manejarArchivo(e) {
    const file = e.target.files?.[0]; if (!file) return;
    setSubiendo(true);
    const url = await subirImagen("posters", file);
    setPoster(url); setSubiendo(false);
  }
  return (
    <div style={{ padding: "0 14px 14px" }}>
      {puedeEditar ? (
        <>
          <Campo label="Responsable">
            <select className="input" value={item.responsable || ""} onChange={(e) => onActualizar({ responsable: e.target.value })}>
              <option value="">— Sin asignar —</option>
              {usuarios.map((u) => <option key={u.id} value={u.id}>{u.nombre}</option>)}
            </select>
          </Campo>
          <Campo label="Descripción"><textarea className="input" style={{ minHeight: 60 }} value={item.descripcion} onChange={(e) => onActualizar({ descripcion: e.target.value })} /></Campo>
          <Campo label="Horario"><input className="input" value={item.horario} onChange={(e) => onActualizar({ horario: e.target.value })} /></Campo>
          <Campo label="Lugar"><input className="input" value={item.lugar} onChange={(e) => onActualizar({ lugar: e.target.value })} /></Campo>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>Miembros</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
            {usuarios.map((u) => (
              <button key={u.id} className="chip" onClick={() => onToggleMiembro(u.id)}>
                <span className={item.miembros.includes(u.id) ? "active" : ""}>{u.nombre}</span>
              </button>
            ))}
          </div>
          <BtnDanger onClick={onBorrar}>Eliminar</BtnDanger>
        </>
      ) : (
        <>
          <p style={{ fontSize: 13, lineHeight: 1.5, marginTop: 0 }}>{item.descripcion}</p>
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "2px 0" }}><strong>Horario:</strong> {item.horario || "—"}</p>
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "2px 0" }}><strong>Lugar:</strong> {item.lugar || "—"}</p>
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "2px 0" }}><strong>Miembros:</strong> {item.miembros.map(nombrePorId).join(", ") || "—"}</p>
        </>
      )}
      {puedeCrearEvento && (
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed var(--line)" }}>
          <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>Crear evento en el calendario general (apartado RES)</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <input type="date" className="input" style={{ width: "auto" }} value={fechaEv} onChange={(e) => setFechaEv(e.target.value)} />
            <input className="input" style={{ flex: 1 }} placeholder="Título del evento" value={tituloEv} onChange={(e) => setTituloEv(e.target.value)} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <label className="btn-secondary" style={{ display: "inline-block" }}>
              {subiendo ? "Subiendo…" : poster ? "Cambiar póster" : "+ Añadir foto / póster"}
              <input type="file" accept="image/*" onChange={manejarArchivo} style={{ display: "none" }} />
            </label>
            {poster && <img src={poster} alt="" style={{ width: 30, height: 30, objectFit: "cover", borderRadius: 4, border: "1px solid var(--line)" }} />}
          </div>
          <BtnLink onClick={() => { onCrearEvento(fechaEv, tituloEv, poster); setFechaEv(""); setTituloEv(""); setPoster(null); }}>+ Añadir al calendario</BtnLink>
        </div>
      )}
    </div>
  );
}
function NuevoItemForm({ categoria, onCrear, onCancelar }) {
  const [nombre, setNombre] = useState(""); const [descripcion, setDescripcion] = useState("");
  const [horario, setHorario] = useState(""); const [lugar, setLugar] = useState("");
  return (
    <div className="card" style={{ marginTop: 10 }}>
      <h2 style={{ fontSize: 15, marginTop: 0 }}>Nueva {categoria === "comisiones" ? "comisión" : "club"}</h2>
      <Campo label="Nombre"><input className="input" value={nombre} onChange={(e) => setNombre(e.target.value)} /></Campo>
      <Campo label="Descripción"><textarea className="input" style={{ minHeight: 60 }} value={descripcion} onChange={(e) => setDescripcion(e.target.value)} /></Campo>
      <Campo label="Horario"><input className="input" value={horario} onChange={(e) => setHorario(e.target.value)} /></Campo>
      <Campo label="Lugar"><input className="input" value={lugar} onChange={(e) => setLugar(e.target.value)} /></Campo>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <Btn onClick={() => nombre && onCrear({ nombre, descripcion, horario, lugar, responsable: "", miembros: [] })}>Crear</Btn>
        <BtnSec onClick={onCancelar}>Cancelar</BtnSec>
      </div>
    </div>
  );
}

/* ============ MÓDULO: SUGERENCIAS ============ */
const CATEGORIAS_SUG = ["peliculas", "libros", "articulos"];
const CATEGORIA_SUG_LABEL = { peliculas: "Películas", libros: "Libros", articulos: "Artículos" };
function ModuloSugerencias({ perfil }) {
  const items = useColeccion("sugerencias");
  const [categoria, setCategoria] = useState("peliculas");
  const [creando, setCreando] = useState(false);
  const esDireccion = perfil.rol === "direccion";
  const itemsCategoria = items.filter((i) => i.categoria === categoria);

  async function borrar(id) { await db.collection("sugerencias").doc(id).delete(); }
  async function actualizar(id, patch) { await db.collection("sugerencias").doc(id).set(patch, { merge: true }); }

    <div>

          <div key={item.id} className="card" style={{ display: "flex", padding: 0, overflow: "hidden" }}>
            {item.imagen && <img src={item.imagen} alt="" style={{ width: 84, objectFit: "cover", flexShrink: 0 }} />}

              {esDireccion ? <textarea className="input" style={{ minHeight: 50, marginBottom: 4 }} value={item.nota} onChange={(e) => actualizar(item.id, { nota: e.target.value })} /> : (item.nota && <p style={{ fontSize: 13, lineHeight: 1.5, color: "var(--ink-soft)", margin: "0 0 6px" }}>{item.nota}</p>)}
              {esDireccion ? <input className="input" placeholder="Enlace" value={item.enlace} onChange={(e) => actualizar(item.id, { enlace: e.target.value })} /> : (item.enlace && <a href={item.enlace} target="_blank" rel="noreferrer" style={{ fontSize: 12 }}>Ver más ↗</a>)}
              {esDireccion && <BtnDanger onClick={() => borrar(item.id)}>Eliminar</BtnDanger>}
            </div>
          </div>
        ))}
      </div>
      {esDireccion && !creando && <Btn style={{ width: "100%", marginTop: 10 }} onClick={() => setCreando(true)}>+ Nueva sugerencia</Btn>}
      {esDireccion && creando && <NuevaSugerenciaForm onCrear={crear} onCancelar={() => setCreando(false)} />}
    </div>
  );
}
function NuevaSugerenciaForm({ onCrear, onCancelar }) {
  const [titulo, setTitulo] = useState(""); const [nota, setNota] = useState("");
  const [enlace, setEnlace] = useState(""); const [imagen, setImagen] = useState(null); const [subiendo, setSubiendo] = useState(false);
  async function manejarArchivo(e) {
    const file = e.target.files?.[0]; if (!file) return;
    setSubiendo(true); const url = await subirImagen("sugerencias", file); setImagen(url); setSubiendo(false);
  }
  return (
    <div className="card" style={{ marginTop: 10 }}>
      <h2 style={{ fontSize: 15, marginTop: 0 }}>Nueva sugerencia</h2>
      <input className="input" placeholder="Título" value={titulo} onChange={(e) => setTitulo(e.target.value)} style={{ marginBottom: 8 }} />
      <textarea className="input" placeholder="Nota" value={nota} onChange={(e) => setNota(e.target.value)} style={{ minHeight: 60, marginBottom: 8 }} />
      <input className="input" placeholder="Enlace" value={enlace} onChange={(e) => setEnlace(e.target.value)} style={{ marginBottom: 8 }} />
      <label className="btn-secondary" style={{ display: "inline-block" }}>
        {subiendo ? "Subiendo…" : imagen ? "Cambiar portada" : "+ Añadir portada"}
        <input type="file" accept="image/*" onChange={manejarArchivo} style={{ display: "none" }} />
      </label>
      {imagen && <img src={imagen} alt="" style={{ display: "block", marginTop: 8, maxWidth: 100, borderRadius: 8, border: "1px solid var(--line)" }} />}
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <Btn onClick={() => titulo && onCrear({ titulo, nota, enlace, imagen })}>Crear</Btn>
        <BtnSec onClick={onCancelar}>Cancelar</BtnSec>
      </div>
    </div>
  );
}

/* ============ MÓDULO: NORMAS ============ */
function ModuloNormas({ perfil }) {
  const normas = useColeccion("normas");
  const [creando, setCreando] = useState(false);
  const esDireccion = perfil.rol === "direccion";
  async function actualizar(id, patch) { await db.collection("normas").doc(id).set(patch, { merge: true }); }
  async function borrar(id) { await db.collection("normas").doc(id).delete(); }
  async function crear(titulo, texto) { if (!titulo) return; await db.collection("normas").add({ titulo, texto, orden: normas.length }); setCreando(false); }
  async function mover(id, dir) {
    const ordenadas = [...normas].sort((a, b) => (a.orden || 0) - (b.orden || 0));
    const idx = ordenadas.findIndex((n) => n.id === id);
    const otro = ordenadas[idx + dir];
    if (!otro) return;
    const batch = db.batch();
    batch.set(db.collection("normas").doc(id), { orden: otro.orden ?? idx + dir }, { merge: true });
    batch.set(db.collection("normas").doc(otro.id), { orden: ordenadas[idx].orden ?? idx }, { merge: true });
    await batch.commit();
  }
  const ordenadas = [...normas].sort((a, b) => (a.orden || 0) - (b.orden || 0));

  return (
    <div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {ordenadas.map((n, i) => (
          <div key={n.id} className="card">
            {esDireccion ? (
              <>
                <input className="input" style={{ fontWeight: 700, marginBottom: 6 }} value={n.titulo} onChange={(e) => actualizar(n.id, { titulo: e.target.value })} />
                <textarea className="input" style={{ minHeight: 60 }} value={n.texto} onChange={(e) => actualizar(n.id, { texto: e.target.value })} />
                <div style={{ display: "flex", gap: 12, marginTop: 8 }}>
                  <BtnLink disabled={i === 0} onClick={() => mover(n.id, -1)}>↑ Subir</BtnLink>
                  <BtnLink disabled={i === ordenadas.length - 1} onClick={() => mover(n.id, 1)}>↓ Bajar</BtnLink>
                  <BtnDanger onClick={() => borrar(n.id)}>Eliminar</BtnDanger>
                </div>
              </>
            ) : (
              <>
                <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>{n.titulo}</div>
                <p style={{ fontSize: 13, lineHeight: 1.5, color: "var(--ink-soft)", margin: 0 }}>{n.texto}</p>
              </>
            )}
          </div>
        ))}
      </div>
      {esDireccion && !creando && <Btn style={{ width: "100%", marginTop: 10 }} onClick={() => setCreando(true)}>+ Nueva norma</Btn>}
      {esDireccion && creando && <NuevaNormaForm onCrear={crear} onCancelar={() => setCreando(false)} />}
    </div>
  );
}
function NuevaNormaForm({ onCrear, onCancelar }) {
  const [titulo, setTitulo] = useState(""); const [texto, setTexto] = useState("");
  return (
    <div className="card" style={{ marginTop: 10 }}>
      <h2 style={{ fontSize: 15, marginTop: 0 }}>Nueva norma</h2>
      <input className="input" placeholder="Título" value={titulo} onChange={(e) => setTitulo(e.target.value)} style={{ marginBottom: 8 }} />
      <textarea className="input" placeholder="Texto" value={texto} onChange={(e) => setTexto(e.target.value)} style={{ minHeight: 70, marginBottom: 8 }} />
      <div style={{ display: "flex", gap: 8 }}>
        <Btn onClick={() => onCrear(titulo, texto)}>Crear</Btn>
        <BtnSec onClick={onCancelar}>Cancelar</BtnSec>
      </div>
    </div>
  );
}

/* ============ MÓDULO: PERFIL Y USUARIOS ============ */
function ModuloPerfil({ perfil, usuarios }) {
  const [vista, setVista] = useState("perfil");
  const esDireccion = perfil.rol === "direccion";
  const pendientes = usuarios.filter((u) => u.estado === "pendiente");
  const [rolElegido, setRolElegido] = useState({});
  async function aprobar(uid, rol) { await db.collection("usuarios").doc(uid).set({ rol, estado: "activo" }, { merge: true }); }
  async function rechazar(uid) { await db.collection("usuarios").doc(uid).delete(); }
  async function cambiarRol(uid, rol) { await db.collection("usuarios").doc(uid).set({ rol }, { merge: true }); }
  async function cambiarEstado(uid, estado) { await db.collection("usuarios").doc(uid).set({ estado }, { merge: true }); }

  return (
    <div>
      <TopTabs opciones={[{ value: "perfil", label: "Perfil" }, ...(esDireccion ? [{ value: "usuarios", label: "Usuarios" }] : [])]} activo={vista} onChange={setVista} />
      {vista === "perfil" && (
        <div className="card">
          <p style={{ fontSize: 14 }}><strong>Nombre:</strong> {perfil.nombre}</p>
          <p style={{ fontSize: 14 }}><strong>Email:</strong> {perfil.email}</p>
          <p style={{ fontSize: 14 }}><strong>Rol:</strong> {ROL_LABEL[perfil.rol]}</p>
          <Btn onClick={() => auth.signOut()}>Cerrar sesión</Btn>
        </div>
      )}
      {vista === "usuarios" && esDireccion && (
        <div className="card">
          <h2 style={{ fontSize: 15, marginTop: 0 }}>Solicitudes pendientes</h2>
          {pendientes.length === 0 && <p className="hint">No hay solicitudes pendientes.</p>}
          {pendientes.map((p) => (
            <div key={p.id} style={{ border: "1px dashed var(--line)", borderRadius: 8, padding: 10, marginBottom: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 700 }}>{p.nombre}</div>
              <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 6 }}>{p.email}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <select className="input" style={{ width: "auto" }} value={rolElegido[p.id] || "resto"} onChange={(e) => setRolElegido({ ...rolElegido, [p.id]: e.target.value })}>
                  {ROLES.map((r) => <option key={r} value={r}>{ROL_LABEL[r]}</option>)}
                </select>
                <BtnLink onClick={() => aprobar(p.id, rolElegido[p.id] || "resto")}>Aprobar</BtnLink>
                <BtnDanger onClick={() => rechazar(p.id)}>Rechazar</BtnDanger>
              </div>
            </div>
          ))}
          <h2 style={{ fontSize: 15 }}>Usuarios activos</h2>
          {usuarios.filter((u) => u.estado === "activo").map((u) => (
            <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderBottom: "1px solid var(--line-soft)" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>{u.nombre}</div>
                <div style={{ fontSize: 11, color: "var(--muted)" }}>{u.email}</div>
              </div>
              <select className="input" style={{ width: "auto" }} value={u.rol} onChange={(e) => cambiarRol(u.id, e.target.value)}>
                {ROLES.map((r) => <option key={r} value={r}>{ROL_LABEL[r]}</option>)}
              </select>
              <BtnDanger onClick={() => cambiarEstado(u.id, "inactivo")}>Desactivar</BtnDanger>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============ APP SHELL ============ */
const MODULOS = [
  { key: "comidas", label: "Comidas", icon: "🍽️" },
  { key: "deportes", label: "Deportes", icon: "🏸" },
  { key: "calendario", label: "Calendario", icon: "📅" },
  { key: "comisiones", label: "Comisiones", icon: "🗂️" },
  { key: "sugerencias", label: "Sugerencias", icon: "🎬" },
  { key: "normas", label: "Normas", icon: "📋" },
  { key: "perfil", label: "Perfil", icon: "👤" },
];

function AppPrincipal({ perfil }) {
  const [seccion, setSeccion] = useState("comidas");
  const usuarios = useColeccion("usuarios");

  const Componente = {
    comidas: <ModuloComidas perfil={perfil} usuarios={usuarios.filter((u) => u.estado === "activo")} />,
    deportes: <ModuloDeportes perfil={perfil} usuarios={usuarios.filter((u) => u.estado === "activo")} />,
    calendario: <ModuloCalendario perfil={perfil} />,
    comisiones: <ModuloComisiones perfil={perfil} usuarios={usuarios.filter((u) => u.estado === "activo")} />,
    sugerencias: <ModuloSugerencias perfil={perfil} />,
    normas: <ModuloNormas perfil={perfil} />,
    perfil: <ModuloPerfil perfil={perfil} usuarios={usuarios} />,
  }[seccion];

  return (
    <div>
      <header style={{ marginBottom: 16 }}>
        <div className="eyebrow">Colegio Mayor Albalat</div>
        <h1 className="title">{MODULOS.find((m) => m.key === seccion).label}</h1>
      </header>
      {Componente}
      <nav className="navbar">
        {MODULOS.map((m) => (
          <button key={m.key} className={"navbtn" + (seccion === m.key ? " active" : "")} onClick={() => setSeccion(m.key)}>
            <span className="navicon">{m.icon}</span>{m.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

function App() {
  const { user, perfil } = useAuthUser();
  const [pantalla, setPantalla] = useState("login");

  if (user === undefined || (user && perfil === undefined)) {
    return <PantallaCentrada><p className="hint" style={{ textAlign: "center" }}>Cargando…</p></PantallaCentrada>;
  }
  if (!user) {
    return pantalla === "registro"
      ? <RegistroScreen onVolver={() => setPantalla("login")} />
      : <LoginScreen onIrRegistro={() => setPantalla("registro")} />;
  }
  if (!perfil || perfil.estado !== "activo") {
    return <PendienteScreen />;
  }
  return <AppPrincipal perfil={perfil} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<pre style="white-space:pre-wrap;padding:14px;font-family:monospace;font-size:11px;background:#fbeae6;color:#a13d2b;border-radius:8px;">ERROR REAL\n' +
    (err && err.stack ? err.stack : String(err)) + '</pre>';
}


</script>
